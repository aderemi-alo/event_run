name: event_run
description: "EventRun - Event Management System for Vendors"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Routing
  go_router: ^17.1.0
  
  # Local Storage
  shared_preferences: ^2.3.4
  
  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  
  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.14
  mockito: ^5.4.4
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  
  # Fonts will be loaded via google_fonts package
  # No local font files needed
