name: app
description: "EventRun - Event Management System for Vendors"
publish_to: 'none'
resolution: workspace
version: 0.1.0
environment:
  sdk: ^3.10.1
  
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  event_run_core:
    path: ../core
  
  # State Management (Align with Core)
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^2.6.1
  
  supabase_flutter: ^2.8.0
  go_router: ^14.6.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  image_picker: ^1.2.1
  iconify_flutter: ^0.0.7
  intl: ^0.20.2
  flutter_lucide: ^1.8.2
  lucide_icons_flutter: ^3.1.10


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  mockito: ^5.4.4
  json_serializable: ^6.9.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: PlusJakartaSans
      fonts:
      - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
    - family: Inter
      fonts:
      - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
